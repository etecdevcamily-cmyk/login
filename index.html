<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Convite Especial - Hogwarts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=MedievalSharp&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'MedievalSharp', cursive;
      overflow: hidden;
      position: relative;
      background-color: #0b132b;
      /* Imagem de "A Noite Estrelada" de Van Gogh em alta resolução com filtro suave */
      background-image: 
        radial-gradient(circle at center, rgba(11, 22, 54, 0.35) 0%, rgba(5, 10, 25, 0.82) 100%),
        url('https://upload.wikimedia.org/wikipedia/commons/thumb/e/ea/Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg/1920px-Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    /* Brilhos mágicos sutis sobre a pintura */
    .particulas-magicas {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image: 
        radial-gradient(2px 2px at 20% 30%, rgba(255, 245, 170, 0.8), transparent),
        radial-gradient(2px 2px at 40% 70%, rgba(135, 206, 250, 0.8), transparent),
        radial-gradient(3px 3px at 75% 25%, rgba(255, 235, 130, 0.9), transparent),
        radial-gradient(2px 2px at 85% 80%, rgba(255, 255, 255, 0.7), transparent);
      animation: cintilar 4s ease-in-out infinite alternate;
      z-index: 1;
    }

    @keyframes cintilar {
      0% { opacity: 0.4; transform: translateY(0); }
      100% { opacity: 0.9; transform: translateY(-8px); }
    }

    .instrucao {
      color: #ffd875;
      font-size: 1.15rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(255, 216, 117, 0.8), 0 2px 4px rgba(0,0,0,0.9);
      margin-bottom: 25px;
      animation: pulsarTexto 2.4s infinite;
      z-index: 10;
      text-align: center;
      padding: 0 15px;
    }

    @keyframes pulsarTexto {
      0%, 100% { opacity: 0.85; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.03); }
    }

    /* Envelope Container */
    .envelope-container {
      position: relative;
      width: 320px;
      height: 210px;
      cursor: pointer;
      z-index: 10;
      perspective: 1000px;
      transition: transform 0.4s ease;
    }

    .envelope-container:hover {
      transform: translateY(-6px) scale(1.02);
    }

    /* Corpo base do envelope */
    .envelope {
      position: relative;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #0c1c42, #162d66);
      border-radius: 6px;
      box-shadow: 0 25px 45px rgba(0, 0, 0, 0.75), 0 0 30px rgba(45, 95, 200, 0.35);
      border: 1px solid rgba(255, 215, 0, 0.25);
    }

    /* Pergaminho escondido dentro */
    .pergaminho {
      position: absolute;
      top: 15px;
      left: 20px;
      width: 280px;
      height: 175px;
      background: radial-gradient(circle at center, #f5e4bb 0%, #dfc38a 85%, #b59353 100%);
      border-radius: 4px;
      box-shadow: inset 0 0 15px rgba(110, 75, 20, 0.5), 0 4px 10px rgba(0, 0, 0, 0.35);
      border: 1px dashed rgba(120, 80, 25, 0.4);
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 15px;
      transition: transform 1.1s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.5s ease;
    }

    .linhas-pergaminho {
      width: 80%;
      height: 2px;
      background: rgba(100, 65, 15, 0.25);
      margin: 6px 0;
      border-radius: 2px;
    }

    .titulo-pergaminho {
      font-family: 'Cinzel Decorative', serif;
      font-size: 0.95rem;
      color: #4a2f0f;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    /* Dobras laterais e frontal */
    .aba-esquerda {
      position: absolute;
      left: 0;
      top: 0;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 105px 0 105px 160px;
      border-color: transparent transparent transparent #102657;
      z-index: 3;
      border-radius: 6px 0 0 6px;
    }

    .aba-direita {
      position: absolute;
      right: 0;
      top: 0;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 105px 160px 105px 0;
      border-color: transparent #102657 transparent transparent;
      z-index: 3;
      border-radius: 0 6px 6px 0;
    }

    .aba-baixo {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 0 160px 115px 160px;
      border-color: transparent transparent #0d1e47 transparent;
      z-index: 4;
      border-radius: 0 0 6px 6px;
    }

    /* Aba superior que abre */
    .aba-topo {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 125px 160px 0 160px;
      border-color: #173373 transparent transparent transparent;
      transform-origin: top center;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 5;
    }

    /* Selo de cera */
    .selo {
      position: absolute;
      top: 95px;
      left: 50%;
      transform: translateX(-50%);
      width: 52px;
      height: 52px;
      background: radial-gradient(circle at 35% 35%, #e63946, #800e13 75%, #470005 100%);
      border-radius: 50%;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.6), 0 0 12px rgba(230, 57, 70, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffd875;
      font-size: 1.4rem;
      z-index: 6;
      border: 2px solid rgba(255, 215, 0, 0.4);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    /* Estados ativados pelo clique */
    .envelope-container.aberto .aba-topo {
      transform: rotateX(180deg);
      z-index: 1;
    }

    .envelope-container.aberto .selo {
      opacity: 0;
      transform: translateX(-50%) scale(0.6);
      pointer-events: none;
    }

    .envelope-container.aberto .pergaminho {
      transform: translateY(-135px) scale(1.08);
      z-index: 15;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
    }
  </style>
</head>
<body>
  <div class="particulas-magicas"></div>

  <p class="instrucao">Toque no envelope para abrir</p>

  <div class="envelope-container" id="envelopeContainer" onclick="abrirCarta()">
    <div class="envelope">
      <!-- Pergaminho que desliza -->
      <div class="pergaminho">
        <span class="titulo-pergaminho">Hogwarts</span>
        <div class="linhas-pergaminho" style="width: 75%;"></div>
        <div class="linhas-pergaminho" style="width: 85%;"></div>
        <div class="linhas-pergaminho" style="width: 65%;"></div>
        <div class="linhas-pergaminho" style="width: 80%;"></div>
      </div>

      <!-- Partes do envelope -->
      <div class="aba-esquerda"></div>
      <div class="aba-direita"></div>
      <div class="aba-baixo"></div>
      <div class="aba-topo"></div>

      <!-- Selo de cera lacrado -->
      <div class="selo">⚡</div>
    </div>
  </div>

  <script>
    let jaAbriu = false;

    function abrirCarta() {
      if (jaAbriu) return;
      jaAbriu = true;

      const container = document.getElementById('envelopeContainer');
      container.classList.add('aberto');

      // Aguarda o pergaminho deslizar completamente e redireciona para a página 2
      setTimeout(() => {
        window.location.href = 'pagina-2.html';
      }, 1400);
    }
  </script>
</body>
</html>
