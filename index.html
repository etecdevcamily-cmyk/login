<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Login</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <form action="/login" method="post">
        <h2>Login</h2>
        <p>Faça login para prosseguir</p>

    <div class="input-group">
        <label for="Email">Email</label>
        <input type="Email" id="Email" name="Email" placeholder="Digite seu email:" required>
    </div>

    <div class="input-group">
        <label for="Email">Senha</label>
         <input type="Senha" id="Senha" name="Senha" placeholder="Digite sua senha:" required>
    </div>
   
    <button type="submit">Entrar</button>
    </form>
    <svg viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg"></svg>
    <ellipse class="inner-glow" cx="100" cy="110" rx="60" ry="30" />
    <rect class="lamp-base" x="92" y="190" width="16" height="160" rx="8" />
    <rect class="lamp-base" x="60" y="250" width="80" height="12" rx="6" />
    <g class="pull-cord">
    <line class="cord-line" x1="130" y1="110" x2="130" y2="180" />
    <circle class="cord-bead" cx="130" cy="190" r="6" />
    <circle class="cord-hit" cx="130" cy="190" r="25" fill="transparent" />
</g>
<path class="lamp-shade" d="M30 110 C 30 50, 170 50, 170 110 C 170 125, 30 125, 30 110 Z" />
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</html>
