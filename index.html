<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Uma Carta Chegou</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet" />
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  font-family: 'Cinzel Decorative', serif;
  color: #d8e2f1;
  overflow: hidden;
  user-select: none;
  /* Fundo na mesma tonalidade azul-escura com degradê */
  background: radial-gradient(circle at 50% 30%, #12264f 0%, #0a1730 45%, #030711 100%);
}

/* Estrelas sutis no fundo */
.estrelas {
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(1.5px 1.5px at 20% 30%, rgba(255,255,255,0.8) 50%, transparent 50%),
    radial-gradient(1px 1px at 70% 15%, rgba(255,255,255,0.6) 50%, transparent 50%),
    radial-gradient(1.5px 1.5px at 85% 60%, rgba(255,255,255,0.7) 50%, transparent 50%),
    radial-gradient(1px 1px at 35% 75%, rgba(255,255,255,0.5) 50%, transparent 50%),
    radial-gradient(1px 1px at 55% 50%, rgba(255,255,255,0.4) 50%, transparent 50%),
    radial-gradient(1.5px 1.5px at 10% 55%, rgba(255,255,255,0.6) 50%, transparent 50%);
  animation: cintilar 4s ease-in-out infinite alternate;
}

@keyframes cintilar {
  from { opacity: 0.4; }
  to { opacity: 1; }
}

.dica {
  margin-bottom: 50px;
  font-size: 1rem;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: #8fa8d1;
  text-shadow: 0 2px 10px rgba(0,0,0,0.9);
  position: relative;
  z-index: 2;
}

/* Cenário do envelope + pergaminho */
.cena {
  position: relative;
  width: 340px;
  height: 300px;
  z-index: 2;
}

/* ----- ENVELOPE ----- */
.envelope {
  position: absolute;
  bottom: 10px;
  left: 50%;
  width: 320px;
  height: 210px;
  transform: translateX(-50%);
  border-radius: 8px;
  background: linear-gradient(160deg, #1c3a72 0%, #142c58 50%, #0d1f40 100%);
  box-shadow: 0 25px 60px rgba(0,0,0,0.8), inset 0 0 40px rgba(0,0,0,0.35);
  cursor: pointer;
  z-index: 3;
}

/* Aba do envelope (triângulo) */
.aba {
  position: absolute;
  top: 0;
  left: 0;
  width: 0;
  height: 0;
  border-left: 160px solid transparent;
  border-right: 160px solid transparent;
  border-top: 118px solid #24488a;
  filter: drop-shadow(0 3px 6px rgba(0,0,0,0.5));
  transform-origin: top center;
  transition: transform 0.9s cubic-bezier(0.6, 0, 0.3, 1);
  z-index: 4;
}

/* Selo de cera vermelho-escuro */
.selo {
  position: absolute;
  top: 88px;
  left: 50%;
  transform: translateX(-50%);
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #a01830 0%, #6e0d1e 60%, #450814 100%);
  box-shadow: 0 6px 18px rgba(0,0,0,0.7), inset 0 2px 6px rgba(255,255,255,0.25);
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 1.6rem;
  color: #f3d9a4;
  z-index: 6;
  transition: transform 0.5s ease, opacity 0.5s ease;
}

.selo:hover {
  transform: translateX(-50%) scale(1.1);
  box-shadow: 0 8px 25px rgba(160, 24, 48, 0.7);
}

/* ----- PERGAMINHO (escondido dentro) ----- */
.pergaminho {
  position: absolute;
  bottom: 20px;
  left: 50%;
  width: 270px;
  height: 180px;
  transform: translateX(-50%);
  background:
    radial-gradient(circle at 20% 20%, rgba(139, 106, 56, 0.25) 0%, transparent 30%),
    radial-gradient(circle at 80% 80%, rgba(139, 106, 56, 0.3) 0%, transparent 35%),
    linear-gradient(175deg, #e8d5a8 0%, #d9bf8a 55%, #c8a86e 100%);
  border-radius: 6px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.7);
  z-index: 2;
  opacity: 0;
  display: flex;
  justify-content: center;
  align-items: center;
}

.pergaminho p {
  font-family: 'Cinzel Decorative', serif;
  font-size: 0.85rem;
  color: #5a3d1e;
  text-align: center;
  letter-spacing: 1px;
  padding: 10px;
}

/* ----- ANIMAÇÃO DE ABERTURA ----- */
.aberto .aba {
  transform: rotateX(180deg);
  z-index: 1;
}

.aberto .selo {
  transform: translateX(-50%) scale(0) rotate(90deg);
  opacity: 0;
}

.aberto .pergaminho {
  animation: sairPergaminho 1.6s ease-out 0.6s forwards;
}

@keyframes sairPergaminho {
  0%   { opacity: 0; transform: translateX(-50%) translateY(40px) scale(0.7); }
  40%  { opacity: 1; }
  100% { opacity: 1; transform: translateX(-50%) translateY(-120px) scale(1.08); }
}

/* Suave desaparecer antes de ir para a página 2 */
.cena.sumindo {
  animation: esvaindo 0.8s ease forwards;
}

@keyframes esvaindo {
  to { opacity: 0; transform: scale(1.15); filter: blur(6px); }
}
</style>
</head>
<body>

<div class="estrelas"></div>

<p class="dica">Você recebeu uma carta 💌</p>

<div class="cena" id="cena">
  <div class="pergaminho">
    <p>✨ Toque para abrir<br>seu destino...</p>
  </div>

  <div class="envelope" id="envelope" onclick="abrirCarta()">
    <div class="aba"></div>
    <div class="selo">🦉</div>
  </div>
</div>

<script>
  let jaAbriu = false;

  function abrirCarta() {
    if (jaAbriu) return;
    jaAbriu = true;

    const cena = document.getElementById('cena');
    cena.classList.add('aberto');

    // Espera o pergaminho sair e leva o visitante à página 2
    setTimeout(() => cena.classList.add('sumindo'), 2600);
    setTimeout(() => {
      window.location.href = 'pagina-2.html';
    }, 3400);
  }
</script>

</body>
</html>
